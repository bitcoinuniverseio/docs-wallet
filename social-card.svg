  <text x="152" y="137" font-family="'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="0.18em" fill="#565b62">UNIVERSE WALLET</text>

  <text x="88" y="266" font-family="'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-0.022em" fill="#15171a">A wallet you can read</text>
  <text x="88" y="352" font-family="'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-0.022em" fill="#15171a">before you sign it</text>

