  <title id="sc-t">Universe Wallet documentation. A wallet you can read before you sign it.</title>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1200" height="10" fill="#15171a"/>

  <g transform="translate(88 104)" fill="none" stroke="#565b62" stroke-width="3.4">
    <rect x="1.7" y="1.7" width="44.6" height="44.6" rx="9"/>
    <path d="M24 14v9"/>
