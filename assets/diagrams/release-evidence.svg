<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Why a protocol appears in the product only when evidence proves it</title>
  <desc id="desc">A protocol passes through five states before a user can act on it. Code exists in the repository. The release intends to ship the operation. Evidence is gathered for the exact build: unit tests, negative vectors, wrong-network rejection, a browser end-to-end run, dependency health, indexer agreement, wallet reconciliation, and reorg retry. That evidence is bound to the exact source commit and verified. Only then is the operation authorized and reachable in the product. A build that reaches a user without authorization shows the operation as unavailable and names what is missing, rather than failing when the user tries it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .stage { fill: #fbf7fa; stroke: #e6dde6; }
    .stage-live { fill: #f2fbf5; stroke: #b9e3c8; }
    .t { fill: #1a1119; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dim { fill: #5f5262; }
    .h { font-weight: 700; font-size: 17px; }
    .lbl { font-weight: 600; font-size: 12px; }
    .xs { font-size: 10px; }
    .sm { font-size: 11px; }
    .num { fill: #b3006f; font-weight: 700; font-size: 10px; }
    .safe { fill: #1a7f43; }
    .hold { fill: #b3006f; }
    .link { stroke: #cfc4d0; stroke-width: 2; fill: none; }
    .head { fill: #cfc4d0; }
    .rule { stroke: #e6dde6; }
    .evbox { fill: #ffffff; stroke: #e6dde6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e0a13; }
      .stage { fill: #16101d; stroke: #372b47; }
      .stage-live { fill: #0f1a13; stroke: #2c5a3c; }
      .t { fill: #f3edf5; }
      .dim { fill: #a9a0b3; }
      .num { fill: #ff7ab8; }
      .safe { fill: #5fd18b; }
      .hold { fill: #ff7ab8; }
      .link { stroke: #4a3b59; }
      .head { fill: #4a3b59; }
      .rule { stroke: #372b47; }
      .evbox { fill: #1c1526; stroke: #372b47; }
    }
  </style>
  <rect class="bg" width="880" height="420"/>

  <text class="t h" x="32" y="40">Code existing is not support.</text>
  <line class="rule" x1="32" y1="56" x2="848" y2="56"/>

  <g>
    <rect class="stage" x="32" y="84" width="146" height="86" rx="12"/>
    <text class="num" x="48" y="104">1</text>
    <text class="t lbl" x="48" y="124">Written</text>
    <text class="dim xs" x="48" y="142">The code exists in</text>
    <text class="dim xs" x="48" y="156">the repository.</text>
  </g>
  <path class="link" d="M 178 127 H 196"/>
  <path class="head" d="M 196 121 L 208 127 L 196 133 Z"/>

  <g>
    <rect class="stage" x="208" y="84" width="146" height="86" rx="12"/>
    <text class="num" x="224" y="104">2</text>
    <text class="t lbl" x="224" y="124">Intended</text>
    <text class="dim xs" x="224" y="142">This release means</text>
    <text class="dim xs" x="224" y="156">to ship it.</text>
  </g>
  <path class="link" d="M 354 127 H 372"/>
  <path class="head" d="M 372 121 L 384 127 L 372 133 Z"/>

  <g>
    <rect class="stage" x="384" y="84" width="146" height="86" rx="12"/>
    <text class="num" x="400" y="104">3</text>
    <text class="t lbl" x="400" y="124">Evidenced</text>
    <text class="dim xs" x="400" y="142">Eight classes of</text>
    <text class="dim xs" x="400" y="156">proof, all passing.</text>
  </g>
  <path class="link" d="M 530 127 H 548"/>
  <path class="head" d="M 548 121 L 560 127 L 548 133 Z"/>

  <g>
    <rect class="stage" x="560" y="84" width="146" height="86" rx="12"/>
    <text class="num" x="576" y="104">4</text>
    <text class="t lbl" x="576" y="124">Bound</text>
    <text class="dim xs" x="576" y="142">Tied to the exact</text>
    <text class="dim xs" x="576" y="156">build, and verified.</text>
  </g>
  <path class="link" d="M 706 127 H 724"/>
  <path class="head" d="M 724 121 L 736 127 L 724 133 Z"/>

  <g>
    <rect class="stage-live" x="736" y="84" width="112" height="86" rx="12"/>
    <text class="num" x="752" y="104">5</text>
    <text class="t lbl" x="752" y="124">Usable</text>
    <text class="safe xs" x="752" y="142" style="font-weight:600">You can act</text>
    <text class="safe xs" x="752" y="156" style="font-weight:600">on it.</text>
  </g>

  <text class="t lbl" x="32" y="212">The eight classes of proof</text>
  <line class="rule" x1="32" y1="224" x2="848" y2="224"/>

  <g>
    <rect class="evbox" x="32" y="238" width="196" height="34" rx="8"/>
    <text class="t sm" x="48" y="260">Unit</text>
    <rect class="evbox" x="240" y="238" width="196" height="34" rx="8"/>
    <text class="t sm" x="256" y="260">Negative vector</text>
    <rect class="evbox" x="448" y="238" width="196" height="34" rx="8"/>
    <text class="t sm" x="464" y="260">Wrong network rejected</text>
    <rect class="evbox" x="656" y="238" width="192" height="34" rx="8"/>
    <text class="t sm" x="672" y="260">Browser end to end</text>

    <rect class="evbox" x="32" y="282" width="196" height="34" rx="8"/>
    <text class="t sm" x="48" y="304">Dependency health</text>
    <rect class="evbox" x="240" y="282" width="196" height="34" rx="8"/>
    <text class="t sm" x="256" y="304">Indexer agreement</text>
    <rect class="evbox" x="448" y="282" width="196" height="34" rx="8"/>
    <text class="t sm" x="464" y="304">Wallet reconciliation</text>
    <rect class="evbox" x="656" y="282" width="192" height="34" rx="8"/>
    <text class="t sm" x="672" y="304">Reorg retry</text>
  </g>

  <text class="hold sm" x="32" y="352" style="font-weight:700">Missing evidence never becomes a broken feature.</text>
  <text class="dim xs" x="32" y="372">If any class is missing, stale, gathered against a different build, or points at a dependency that is not healthy, the operation stays</text>
  <text class="dim xs" x="32" y="388">unauthorized. The product then shows it as unavailable and names what is missing, instead of offering an action that would fail.</text>
  <text class="dim xs" x="32" y="408">This is why the supported list can be shorter than the protocol list. The shorter list is the honest one.</text>
</svg>
