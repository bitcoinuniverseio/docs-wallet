<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Universe Wallet: see what you own, understand what you are approving, act without fear</title>
  <desc id="desc">The Universe Wallet promise, stated in three parts. See what you own: every coin classified before it can be spent. Understand what you are approving: what leaves, what returns, the fee, and how sure the wallet is about each fact. Act without fear: asset-bearing coins are held out of ordinary payments, connections expire, and a capability appears only when evidence proves it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #fbf7fa; stroke: #e6dde6; }
    .t { fill: #1a1119; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dim { fill: #5f5262; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #b3006f; }
    .claim { font-size: 27px; font-weight: 700; }
    .lbl { font-size: 14px; font-weight: 700; }
    .xs { font-size: 11px; }
    .accent { fill: #b3006f; }
    .sweep { fill: url(#sweep); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e0a13; }
      .card { fill: #16101d; stroke: #372b47; }
      .t { fill: #f6f0f8; }
      .dim { fill: #a9a0b3; }
      .brand { fill: #ff7ab8; }
      .accent { fill: #ff7ab8; }
    }
  </style>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0066"/>
      <stop offset="46%" stop-color="#e10098"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="880" height="300"/>
  <rect class="sweep" x="0" y="0" width="880" height="4"/>

  <text class="brand" x="32" y="52">UNIVERSE WALLET</text>
  <text class="t claim" x="32" y="98">See what you own.</text>
  <text class="t claim" x="32" y="132">Understand what you are approving.</text>
  <text class="t claim" x="32" y="166">Act without fear.</text>
  <text class="dim xs" x="32" y="194">A self-custody browser extension for Bitcoin, Dogecoin and Zcash. Your keys never leave the extension.</text>

  <rect class="card" x="32" y="216" width="266" height="62" rx="12"/>
  <text class="t lbl" x="52" y="242">Coins are classified first</text>
  <text class="dim xs" x="52" y="262">A coin carrying an asset never funds a payment.</text>

  <rect class="card" x="310" y="216" width="266" height="62" rx="12"/>
  <text class="t lbl" x="330" y="242">Signatures are readable</text>
  <text class="dim xs" x="330" y="262">What leaves, what returns, the fee, and how sure.</text>

  <rect class="card" x="588" y="216" width="260" height="62" rx="12"/>
  <text class="t lbl" x="608" y="242">Claims carry evidence</text>
  <text class="dim xs" x="608" y="262">A capability ships only when proof exists.</text>
</svg>
