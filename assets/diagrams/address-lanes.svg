<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="title desc">
  <title id="title">One recovery phrase, several addresses, and what each one is for</title>
  <desc id="desc">A single recovery phrase derives one account. That account exposes a Native SegWit payment address for everyday bitcoin, a Taproot address that receives inscriptions and other Bitcoin-native assets, and separate addresses on Dogecoin and Zcash. Sending an asset to the payment address, or bitcoin to a Dogecoin address, is the mistake each lane exists to prevent.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #fbf7fa; stroke: #e6dde6; }
    .seed { fill: #fdf3f8; stroke: #f3c2da; }
    .t { fill: #1a1119; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dim { fill: #5f5262; }
    .h { font-weight: 700; font-size: 17px; }
    .lbl { font-weight: 600; font-size: 13px; }
    .sm { font-size: 12px; }
    .xs { font-size: 11px; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; fill: #5f5262; }
    .accent { fill: #b3006f; }
    .caution { fill: #8a5a00; }
    .line { stroke: #cfc4d0; fill: none; stroke-width: 2; }
    .rule { stroke: #e6dde6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e0a13; }
      .panel { fill: #16101d; stroke: #372b47; }
      .seed { fill: #1d0f1a; stroke: #6b2350; }
      .t { fill: #f3edf5; }
      .dim { fill: #a9a0b3; }
      .mono { fill: #a9a0b3; }
      .accent { fill: #ff7ab8; }
      .caution { fill: #f0b74d; }
      .line { stroke: #4a3b59; }
      .rule { stroke: #372b47; }
    }
  </style>
  <rect class="bg" width="880" height="400"/>

  <text class="t h" x="32" y="40">One phrase backs every address. Each address has one job.</text>
  <line class="rule" x1="32" y1="56" x2="848" y2="56"/>

  <rect class="seed" x="32" y="92" width="196" height="96" rx="14"/>
  <text class="t lbl" x="52" y="122">Recovery phrase</text>
  <text class="dim xs" x="52" y="142">12 words, written offline.</text>
  <text class="dim xs" x="52" y="158">Restores everything below,</text>
  <text class="dim xs" x="52" y="174">on any device.</text>

  <path class="line" d="M 228 140 H 268 V 108 H 300"/>
  <path class="line" d="M 268 140 H 300"/>
  <path class="line" d="M 268 140 V 232 H 300"/>
  <path class="line" d="M 268 232 V 312 H 300"/>

  <!-- Payment -->
  <rect class="panel" x="300" y="80" width="548" height="56" rx="12"/>
  <text class="t lbl" x="320" y="103">Payment address</text>
  <text class="dim xs" x="320" y="121">Native SegWit. Everyday bitcoin in and out.</text>
  <text class="mono" x="828" y="112" text-anchor="end">bc1q...synthetic</text>

  <!-- Collectible -->
  <rect class="panel" x="300" y="146" width="548" height="56" rx="12"/>
  <text class="t lbl" x="320" y="169">Asset address</text>
  <text class="dim xs" x="320" y="187">Taproot. Inscriptions and Bitcoin-native assets arrive here.</text>
  <text class="mono" x="828" y="178" text-anchor="end">bc1p...synthetic</text>

  <!-- Dogecoin -->
  <rect class="panel" x="300" y="212" width="548" height="56" rx="12"/>
  <text class="t lbl" x="320" y="235">Dogecoin address</text>
  <text class="dim xs" x="320" y="253">A different chain. Bitcoin sent here is not recoverable.</text>
  <text class="mono" x="828" y="244" text-anchor="end">D...synthetic</text>

  <!-- Zcash -->
  <rect class="panel" x="300" y="278" width="548" height="56" rx="12"/>
  <text class="t lbl" x="320" y="301">Zcash address</text>
  <text class="dim xs" x="320" y="319">A different chain, with its own shielded rules.</text>
  <text class="mono" x="828" y="310" text-anchor="end">t1...synthetic</text>

  <text class="accent xs" x="32" y="228" style="font-weight:600">Why they differ</text>
  <text class="dim xs" x="32" y="248">An asset sent to the payment</text>
  <text class="dim xs" x="32" y="264">address still arrives, but it lands</text>
  <text class="dim xs" x="32" y="280">among coins meant for spending.</text>
  <text class="caution xs" x="32" y="304" style="font-weight:600">The receive screen names the</text>
  <text class="caution xs" x="32" y="320" style="font-weight:600">network and the intended use</text>
  <text class="caution xs" x="32" y="336" style="font-weight:600">above the QR code, every time.</text>

  <text class="dim xs" x="32" y="376">Address types on Bitcoin: Native SegWit is the default. Nested SegWit, Taproot and Legacy are available in settings.</text>
</svg>
