<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 592" width="880" height="592" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of the transaction review screen</title>
  <desc id="desc">The review screen is read top to bottom. It names the requesting site and whether the origin is verified, the account and network in use, a plain-language summary of the action, what leaves the wallet and what returns, the network fee, any protected asset the request touches, and a confidence mark of EXACT, ESTIMATED or UNKNOWN against each interpreted fact. Reject sits beside Approve at the same size. Each annotation on the right states the question that card answers.</desc>
  <style>
    .bg { fill: #ffffff; }
    .screen { fill: #fbf7fa; stroke: #e6dde6; }
    .card { fill: #ffffff; stroke: #e6dde6; }
    .t { fill: #1a1119; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dim { fill: #5f5262; }
    .h { font-weight: 700; font-size: 17px; }
    .lbl { font-weight: 600; font-size: 12px; }
    .sm { font-size: 11px; }
    .xs { font-size: 10px; }
    .ask { font-size: 12px; fill: #b3006f; font-weight: 600; }
    .askdim { font-size: 11px; fill: #5f5262; }
    .safe { fill: #1a7f43; }
    .hold { fill: #b3006f; }
    .warn { fill: #8a5a00; }
    .chip-exact { fill: #e8f6ee; stroke: #b9e3c8; }
    .chip-est { fill: #fdf6e6; stroke: #ecd6a3; }
    .chip-unk { fill: #f2eef4; stroke: #d9cfd9; }
    .lead { stroke: #e2d7e2; stroke-width: 1.5; fill: none; }
    .rule { stroke: #e6dde6; }
    .reject { fill: #ffffff; stroke: #b3006f; }
    .approve { fill: #e10098; stroke: #e10098; }
    .onaccent { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e0a13; }
      .screen { fill: #140f1b; stroke: #372b47; }
      .card { fill: #1c1526; stroke: #372b47; }
      .t { fill: #f3edf5; }
      .dim { fill: #a9a0b3; }
      .ask { fill: #ff7ab8; }
      .askdim { fill: #a9a0b3; }
      .safe { fill: #5fd18b; }
      .hold { fill: #ff7ab8; }
      .warn { fill: #f0b74d; }
      .chip-exact { fill: #10261a; stroke: #2c5a3c; }
      .chip-est { fill: #2a2110; stroke: #5f4a1c; }
      .chip-unk { fill: #221b2b; stroke: #423351; }
      .lead { stroke: #3a2e48; }
      .rule { stroke: #372b47; }
      .reject { fill: #1c1526; stroke: #ff7ab8; }
      .approve { fill: #ff2a85; stroke: #ff2a85; }
      .onaccent { fill: #12070f; }
    }
  </style>
  <rect class="bg" width="880" height="592"/>

  <text class="t h" x="32" y="40">Every card answers one question before you sign.</text>
  <line class="rule" x1="32" y1="56" x2="848" y2="56"/>

  <rect class="screen" x="32" y="80" width="380" height="452" rx="16"/>

  <!-- Origin -->
  <rect class="card" x="48" y="96" width="348" height="52" rx="10"/>
  <text class="t lbl" x="64" y="118">market.example</text>
  <text class="safe sm" x="64" y="136" style="font-weight:600">Verified origin. Connected 4 days ago.</text>
  <path class="lead" d="M 412 122 H 452"/>
  <text class="ask" x="460" y="118">Who is asking?</text>
  <text class="askdim" x="460" y="134">The origin the browser reports, not a name the site chose.</text>

  <!-- Account -->
  <rect class="card" x="48" y="158" width="348" height="48" rx="10"/>
  <text class="dim sm" x="64" y="180">Account 1</text>
  <text class="t sm" x="380" y="180" text-anchor="end" style="font-weight:600">Bitcoin Mainnet</text>
  <text class="dim xs" x="64" y="197">Payment address bc1q...synthetic</text>
  <path class="lead" d="M 412 182 H 452"/>
  <text class="ask" x="460" y="178">Which account and network?</text>
  <text class="askdim" x="460" y="194">Signing on the wrong network is a common, expensive mistake.</text>

  <!-- Summary -->
  <rect class="card" x="48" y="216" width="348" height="52" rx="10"/>
  <text class="t lbl" x="64" y="238">Buy one inscription for 0.0420 BTC</text>
  <text class="dim sm" x="64" y="256">A plain-language reading of the transaction.</text>
  <path class="lead" d="M 412 242 H 452"/>
  <text class="ask" x="460" y="238">What am I actually doing?</text>
  <text class="askdim" x="460" y="254">Stated as an outcome, not as a script or a method name.</text>

  <!-- Diff -->
  <rect class="card" x="48" y="278" width="348" height="86" rx="10"/>
  <text class="dim xs" x="64" y="298">LEAVES YOUR WALLET</text>
  <text class="t sm" x="64" y="316" style="font-weight:600">0.0420 BTC</text>
  <rect class="chip-exact" x="300" y="303" width="80" height="18" rx="9"/>
  <text class="safe xs" x="340" y="316" text-anchor="middle" style="font-weight:700">EXACT</text>
  <text class="dim xs" x="64" y="338">COMES BACK</text>
  <text class="t sm" x="64" y="356" style="font-weight:600">1 inscription, 0.0138 BTC change</text>
  <rect class="chip-est" x="300" y="343" width="80" height="18" rx="9"/>
  <text class="warn xs" x="340" y="356" text-anchor="middle" style="font-weight:700">ESTIMATED</text>
  <path class="lead" d="M 412 320 H 452"/>
  <text class="ask" x="460" y="304">What leaves, and what returns?</text>
  <text class="askdim" x="460" y="320">Both sides, always. A signature that only shows the cost hides half</text>
  <text class="askdim" x="460" y="334">the transaction.</text>

  <!-- Fee -->
  <rect class="card" x="48" y="374" width="348" height="44" rx="10"/>
  <text class="dim sm" x="64" y="396">Network fee</text>
  <text class="t sm" x="380" y="396" text-anchor="end" style="font-weight:600">0.0000 21 BTC at 8 sat/vB</text>
  <path class="lead" d="M 412 396 H 452"/>
  <text class="ask" x="460" y="392">What does it cost to confirm?</text>
  <text class="askdim" x="460" y="408">The fee and the rate, so the number can be judged rather than trusted.</text>

  <!-- Protected -->
  <rect class="card" x="48" y="428" width="348" height="44" rx="10"/>
  <text class="hold sm" x="64" y="450" style="font-weight:700">PROTECTED ASSET IN THIS REQUEST</text>
  <text class="dim xs" x="64" y="465">Names the coin and the asset it carries.</text>
  <path class="lead" d="M 412 450 H 452"/>
  <text class="ask" x="460" y="446">Is a collectible at risk?</text>
  <text class="askdim" x="460" y="462">Present only when the request touches one, so it never becomes noise.</text>

  <!-- Actions -->
  <rect class="reject" x="48" y="486" width="166" height="34" rx="10"/>
  <text class="hold sm" x="131" y="508" text-anchor="middle" style="font-weight:700">Reject</text>
  <rect class="approve" x="230" y="486" width="166" height="34" rx="10"/>
  <text class="onaccent sm" x="313" y="508" text-anchor="middle" style="font-weight:700">Approve</text>
  <path class="lead" d="M 412 503 H 452"/>
  <text class="ask" x="460" y="499">Can I say no easily?</text>
  <text class="askdim" x="460" y="515">Reject has the same size and prominence as Approve. Neither is styled to win.</text>

  <line class="rule" x1="32" y1="546" x2="848" y2="546"/>
  <rect class="chip-exact" x="32" y="556" width="66" height="18" rx="9"/>
  <text class="safe xs" x="65" y="569" text-anchor="middle" style="font-weight:700">EXACT</text>
  <text class="dim xs" x="106" y="569">read from the transaction itself</text>
  <rect class="chip-est" x="286" y="556" width="88" height="18" rx="9"/>
  <text class="warn xs" x="330" y="569" text-anchor="middle" style="font-weight:700">ESTIMATED</text>
  <text class="dim xs" x="382" y="569">derived, and could move</text>
  <rect class="chip-unk" x="560" y="556" width="82" height="18" rx="9"/>
  <text class="dim xs" x="601" y="569" text-anchor="middle" style="font-weight:700">UNKNOWN</text>
  <text class="dim xs" x="650" y="569">shown, never rounded to zero</text>
</svg>
