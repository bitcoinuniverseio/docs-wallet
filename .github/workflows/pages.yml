name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The RunsOn artifact proxy returns a plain-text endpoint marker to
    # actions/upload-artifact, which makes the Pages upload fail after a
    # successful build. This workflow runs only for trusted main pushes or a
    # maintainer dispatch, so the organization-owned Linux fleet is safe here.
    runs-on: [self-hosted, Linux, X64, universe]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      - name: Install
        run: npm ci
      - name: Gates that must hold on the deployed commit
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish to the gh-pages branch
        # Branch publishing keeps the site out of Actions artifact storage,
        # which the Free plan shares with private packages and is full.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Publish ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
