name: Documentation checks

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: links, images, copy rules, capability claims
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: runs-on=${{ github.run_id }}-docs/runner=universe-cheap/cpu=2+8/env=production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run documentation checks
        run: node scripts/check-docs.mjs
      # A capability block that has drifted from the snapshot is claiming
      # something about a build the build does not support, so it fails here
      # rather than reaching a reader.
      - name: Verify generated capability blocks are current
        run: node scripts/sync-capability.mjs --check
