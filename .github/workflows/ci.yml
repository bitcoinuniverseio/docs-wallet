name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

# This repository is public, so checks run on the organization's public-safe
# capacity preset. A fork pull request must never reach self-hosted
# infrastructure.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, linux, x64, universe-super]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main

      - name: Install
        run: npm ci

      # Copy rules, public-safety scan, capability claims against the generated
      # snapshot, manifest and per-page provenance, the shared platform schema,
      # diagram accessibility, llms.txt freshness, data schemas and
      # cross-references, and markdown lint.
      - name: Content and truthfulness gates
        run: npm test
        env:
          # A pull request without the wallet capture export imported yet fails
          # here; the empty-catalog allowance exists only for local work.
          DOCS_ALLOW_EMPTY_CAPTURES: ''

      - name: Build (validates every internal link and anchor)
        run: npm run build

      - name: Search index exists
        run: test -f dist/pagefind/pagefind.js

      - name: Sitemap exists
        run: test -f dist/sitemap-index.xml

      - name: A helpful 404 exists
        run: test -f dist/404.html

      - name: Machine-readable corpus is fresh (llms-full, JSON endpoints, Markdown)
        run: npm run check:machine

      - name: MCP protocol conformance and grounding
        run: npm run check:mcp

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install a browser for the accessibility audit
        # System libraries are provisioned in the shared runner image.
        # Do not contend for the host package manager during a repository job.
        run: npx playwright install chromium

      # One process owns a loopback ephemeral-port preview and its audit child.
      # Readiness checks the per-run identity and exact build, with bounded waits.
      - name: Accessibility and horizontal overflow, every page, both themes
        run: npm run check:a11y

      - name: Secret scan (full history)
        uses: trufflesecurity/trufflehog@v3.90.5
        with:
          base: ''
          head: ''
          extra_args: --only-verified
